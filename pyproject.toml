[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sm-resilient-launcher"
version = "0.1.0"
description = "SageMaker Capacity-Resilient Job Launcher — automatic fallback across instance types and regions for Batch Transform."
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "botocore",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--ignore=tests/integration"
